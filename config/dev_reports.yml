  - slug: piano-roll-webmusic-score
    title: Editor piano roll inspirado no BandLab
    description: Evoluiu o protótipo para um editor MIDI em Canvas, com viewport navegável e estado musical em ticks baseado no @webmusic/score.
    changes:
      - Adicionou teclado virtual de quatro oitavas, régua de compassos, zoom, rolagem e lane de velocity.
      - Permitiu criar, selecionar, mover, redimensionar e excluir notas com snap musical configurável.
      - Integrou playhead e reprodução temporária ao Tone.js sem persistência de composição.
      - Corrigiu a rolagem sincronizada da grade, teclado, régua e velocity, incluindo navegação pelo wheel.
      - Limitou a criação ao último compasso e ativou Delete após selecionar uma nota com o mouse.
      - Alinhou os quatro compassos da grade ao Score e fez o botão Parar interromper o sintetizador.
      - Tornou as alças de redimensionamento visíveis e ampliou sua área de captura; acrescentou um menu de duração para notas selecionadas.
      - Incluiu seleção por área com Shift e movimento em grupo que preserva os intervalos temporais entre notas.
      - Estendeu a agulha de reprodução à altura completa da grade, inclusive durante a rolagem vertical.
      - Adicionou marcadores móveis de início e fim do loop na régua, com repetição ligada inicialmente e ajuste por ponteiro ou teclado.
      - Fez Espaço alternar reprodução e parada fora dos controles, com agendamento antecipado no Tone.js e corte de notas no fim do intervalo.
      - Reservou o Espaço duplo em até 300 ms para pausar e devolver a agulha ao início do loop, sem mover os marcadores; o Espaço simples mantém a posição ao pausar.
      - Corrigiu a retomada pelo Espaço para continuar áudio e agulha do tick pausado, incluindo o restante de notas em andamento; clique direito exclui somente a nota atingida.
    delivered_on: "2026-10-14"
    tags:
      - Interface
      - Composição
      - MIDI
    test_path: /componentes

