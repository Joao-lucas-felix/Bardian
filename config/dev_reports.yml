  - slug: arranjo-canvas-instrumentos-iniciais
    title: Frases alinhadas e instrumentos iniciais
    description: A criação reúne quatro frases no mesmo trecho, com prévias ilustrativas em Canvas, editor compacto e timbres locais de piano, cordas e bateria.
    changes:
      - Alinhou as quatro camadas numa régua comum de quatro compassos e desenhou prévias derivadas das notas MIDI, sem representar áudio gravado.
      - Reduziu a altura visível do piano roll na criação e mostrou a Bateria em três linhas próprias para bumbo, caixa e chimbal.
      - Permitiu escolher piano acústico ou cordas em cada frase melódica sem alterar as notas; a Bateria usa um kit fixo.
      - Reproduziu as frases individualmente com amostras locais e registrou origem e licença CC0 das novas amostras em SOURCE.txt.
      - Corrigiu o ataque quase inaudível das cordas em notas curtas, ajustando as cinco amostras e o volume do instrumento sem alterar o MIDI.
      - Verificou testes Rails e JavaScript, RuboCop, formatos MP3 e os fluxos de abertura, troca de som e reprodução no navegador.
      - Manteve as frases apenas na memória da página; não há salvamento nem reprodução simultânea das camadas.
    delivered_on: "2026-10-15"
    tags:
      - Composição
      - Interface
      - Áudio
    test_path: /criar

