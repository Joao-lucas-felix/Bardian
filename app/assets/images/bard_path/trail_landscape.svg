<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" shape-rendering="crispEdges">
<title>Estrada de terra e taverna entre árvores</title>
  <style>
    /* Movimento curto de chegada: termina em quatro segundos e não distrai durante a leitura. */
    .tavern-banner { transform-origin: 376px 31px; animation: banner-arrival 2s ease-in-out 2; }
    .chimney-smoke { animation: smoke-arrival 4s ease-out both; }
    @keyframes banner-arrival { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(3deg); } }
    @keyframes smoke-arrival { 0% { opacity: 0; transform: translate(0, 0); } 25% { opacity: .55; } 100% { opacity: 0; transform: translate(7px, -20px); } }
    @media (prefers-reduced-motion: reduce) { .tavern-banner, .chimney-smoke { animation: none; } .chimney-smoke { display: none; } }
  </style>  <defs>
    <pattern id="grass" width="64" height="56" patternUnits="userSpaceOnUse">
      <rect width="64" height="56" fill="#b5c77b"/>
      <path d="M8 14h4v4H8zm36 22h6v2h-6zM24 48h2v4h-2z" fill="#a8be70"/>
      <path d="M52 8h4v2h-4zM18 30h6v2h-6z" fill="#c1d087"/>
    </pattern>
    <pattern id="roof" width="24" height="36" patternUnits="userSpaceOnUse">
