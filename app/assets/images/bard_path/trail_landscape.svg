      <path d="M19 10h17v5H19zM12 23h13v5H12zm24 8h12v5H36z" fill="#e0b45d"/>
    </g>
    <g id="flower">
      <path d="M4 4h2v9H4z" fill="#789b51"/><path d="M2 2h6v6H2z" fill="#f5e7a0"/><path d="M4 4h2v2H4z" fill="#c9a558"/>
    </g>
    <g id="fence">
