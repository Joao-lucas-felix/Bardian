      <path d="M20 9h17v5H20zm-7 13h15v5H13zm24 8h12v5H37z" fill="#a2b966"/>
      <path d="M15 45h12v5H15zm24-4h10v5H39z" fill="#587e44"/>
    </g>
    <g id="autumn">
